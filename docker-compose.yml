services:
  next-app:
    build: .
    ports:
      - "3000:3000"
    volumes:
      - ./data:/app/data
    environment:
      - TTS_SIDECAR_URL=http://tts-sidecar:8000
      - NODE_ENV=production
    depends_on:
      tts-sidecar:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "wget", "-q", "--spider", "http://localhost:3000"]
      interval: 10s
      timeout: 5s
      retries: 3
    restart: unless-stopped

  tts-sidecar:
    build: ./tts-sidecar
    volumes:
      - ./data/tts-cache:/data/tts-cache
    environment:
      - TTS_CACHE_DIR=/data/tts-cache
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8000/health"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 10s
    restart: unless-stopped
