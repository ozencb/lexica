name: Build and Publish Docker Image

on:
  push:
    tags:
      - "v*"
  workflow_dispatch:
    branches:
      - main

env:
  REGISTRY: ghcr.io

jobs:
  build-and-push:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write

    steps:
      - uses: actions/checkout@v4

      - uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - uses: docker/metadata-action@v5
        id: meta-app
        with:
          images: ${{ env.REGISTRY }}/${{ github.repository_owner }}/lexica
          tags: |
            type=semver,pattern={{version}}
            type=semver,pattern={{major}}.{{minor}}
            type=semver,pattern={{major}}
            type=raw,value=latest,enable={{is_default_branch}}
            type=sha

      - uses: docker/metadata-action@v5
        id: meta-tts
        with:
          images: ${{ env.REGISTRY }}/${{ github.repository_owner }}/lexica-tts
          tags: |
            type=semver,pattern={{version}}
            type=semver,pattern={{major}}.{{minor}}
            type=semver,pattern={{major}}
            type=raw,value=latest,enable={{is_default_branch}}
            type=sha

      - uses: docker/setup-buildx-action@v3

      - name: Build and push app image
        uses: docker/build-push-action@v6
        with:
          context: .
          push: true
          tags: ${{ steps.meta-app.outputs.tags }}
          labels: ${{ steps.meta-app.outputs.labels }}
          platforms: linux/amd64,linux/arm64
          file: Dockerfile
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Build and push TTS sidecar image
        uses: docker/build-push-action@v6
        with:
          context: ./tts-sidecar
          push: true
          tags: ${{ steps.meta-tts.outputs.tags }}
          labels: ${{ steps.meta-tts.outputs.labels }}
          platforms: linux/amd64,linux/arm64
          file: ./tts-sidecar/Dockerfile
          cache-from: type=gha,scope=tts
          cache-to: type=gha,scope=tts,mode=max
